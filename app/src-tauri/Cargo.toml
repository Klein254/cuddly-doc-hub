[package]
name = "vector-doc-hub"
version = "1.0.0"
description = "Vector Doc Hub"
authors = ["Vector Technical"]
edition = "2021"

[lib]
name = "vector_doc_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
